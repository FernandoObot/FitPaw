<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mascota - Pinguino</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene">
      <section class="card">
        <h1 class="title">Mascota</h1>
        <div class="penguin-wrap" aria-live="polite">
          <div id="statusMsg" class="status" aria-live="polite"></div>
          <img
            id="penguin"
            class="penguin"
            src="img/feliz.png"
            alt="Pinguino feliz"
          />
          <img
            id="fish"
            class="fish"
            src="img/pez.png"
            alt="Pez"
            aria-hidden="true"
          />
        </div>
        <div class="food">
          <div class="food-label">Comida</div>
          <div class="food-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
            <div id="foodFill" class="food-fill"></div>
          </div>
          <div class="feed-row">
            <button id="feedBtn" class="feed-btn" type="button">Alimentar</button>
            <span id="fishCount" class="fish-count">10 peces</span>
          </div>
        </div>
        <p class="hint">La barra baja a los 20s y 30s, puedes alimentar al pinguino.</p>
      </section>
    </main>

    <script>
      const penguin = document.getElementById("penguin");
      const foodFill = document.getElementById("foodFill");
      const foodBar = document.querySelector(".food-bar");
      const feedBtn = document.getElementById("feedBtn");
      const feedRow = document.querySelector(".feed-row");
      const fish = document.getElementById("fish");
      const statusMsg = document.getElementById("statusMsg");
      const fishCountLabel = document.getElementById("fishCount");

      const states = {
        feliz: { src: "img/feliz.png", alt: "Pinguino feliz" },
        triste: { src: "img/triste.png", alt: "Pinguino triste" },
        llorando: { src: "img/llorando.png", alt: "Pinguino llorando" }
      };

      const feedMessages = ["que rico", "super peces!", "delicioso"];

      let fishCount = 10;

      let currentLevel = 100;
      let happyTimeoutId = null;

      function setFoodLevel(percent) {
        currentLevel = Math.max(0, Math.min(100, percent));
        foodFill.style.width = `${currentLevel}%`;
        foodBar.setAttribute("aria-valuenow", String(currentLevel));
      }

      function swapPenguin(state) {
        penguin.classList.add("fade");
        setTimeout(() => {
          penguin.src = state.src;
          penguin.alt = state.alt;
          penguin.classList.remove("fade");
        }, 350);
      }

      function updatePenguinByLevel() {
        if (currentLevel <= 25) {
          swapPenguin(states.llorando);
          statusMsg.textContent = "deberias alimentarme";
          return;
        }

        if (currentLevel < 50) {
          swapPenguin(states.triste);
          statusMsg.textContent = "tengo hambre";
          return;
        }

        if (currentLevel < 75) {
          swapPenguin(states.feliz);
          statusMsg.textContent = "se me antojan unos peces";
          return;
        }

        swapPenguin(states.feliz);
        statusMsg.textContent = "";
      }

      function updateFishCounter() {
        fishCountLabel.textContent = `${fishCount} peces`;
        if (fishCount <= 0) {
          feedBtn.disabled = true;
          statusMsg.textContent = "realiza tus tareas para conseguir mas peces";
        }
      }

      function showFish() {
        fish.classList.remove("fish-hide");
        fish.classList.add("fish-throw");
        setTimeout(() => {
          fish.classList.remove("fish-throw");
          fish.classList.add("fish-hide");
        }, 700);
      }

      function feedPenguin() {
        if (fishCount <= 0) {
          return;
        }

        showFish();
        if (happyTimeoutId) {
          clearTimeout(happyTimeoutId);
        }

        fishCount -= 1;
        updateFishCounter();
        setFoodLevel(currentLevel + 10);
        swapPenguin(states.feliz);
        statusMsg.textContent = feedMessages[Math.floor(Math.random() * feedMessages.length)];

        happyTimeoutId = setTimeout(() => {
          updatePenguinByLevel();
          happyTimeoutId = null;
        }, 900);
      }

      setFoodLevel(100);
      updatePenguinByLevel();
      updateFishCounter();

      feedBtn.addEventListener("click", feedPenguin);
      feedRow.addEventListener("click", () => {
        if (fishCount <= 0) {
          statusMsg.textContent = "realiza tus tareas para conseguir mas peces";
        }
      });

      setTimeout(() => {
        setFoodLevel(50);
        updatePenguinByLevel();
      }, 20000);

      setTimeout(() => {
        setFoodLevel(0);
        updatePenguinByLevel();
      }, 30000);
    </script>
  </body>
</html>
