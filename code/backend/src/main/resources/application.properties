# DataSource Configuration - PostgreSQL via Supabase
spring.datasource.url=jdbc:postgresql://${db.HOST}:${db.PORT}/${db.DB}
spring.datasource.username=${db.USER}
spring.datasource.password=${db.PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=false

# JWT configuration
jwt.secret=please_change_this_secret
jwt.expiration-ms=3600000

# application defaults
app.default.role=USER

# Security debug
logging.level.org.springframework.security=DEBUG

# Pet hunger config: 5 points every 1 minute, total hunger is 100.
pet.hunger.decrease-ms-per-step=60000
pet.hunger.points-per-step=5
pet.hunger.scheduler-rate-ms=1000

# Multipart upload limits for progress photos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
